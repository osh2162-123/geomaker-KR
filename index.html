<div class="hub">
  <header class="hub-top">
    <div class="hub-brand"><span class="hub-mark" aria-hidden="true"></span><h1>지리 자료 제작기</h1></div>
    <nav class="hub-tabs" role="tablist" aria-label="도구"><div class="hub-group" role="presentation"><span class="hub-gl" aria-hidden="true">백지도</span><button type="button" class="hub-tab" role="tab" id="hub-tab-mapquick" aria-controls="hub-tool-mapquick" aria-selected="false" tabindex="-1" aria-label="백지도 자동 생성기">자동 생성</button><button type="button" class="hub-tab" role="tab" id="hub-tab-mapedit" aria-controls="hub-tool-mapedit" aria-selected="false" tabindex="-1" aria-label="백지도 편집기">편집기</button><button type="button" class="hub-tab" role="tab" id="hub-tab-kmap" aria-controls="hub-tool-kmap" aria-selected="false" tabindex="-1" aria-label="한국지리 백지도">한국지리</button></div><div class="hub-group" role="presentation"><span class="hub-gl" aria-hidden="true">모식도</span><button type="button" class="hub-tab" role="tab" id="hub-tab-landform" aria-controls="hub-tool-landform" aria-selected="false" tabindex="-1" aria-label="지형 모식도 편집기">지형</button></div><div class="hub-group" role="presentation"><span class="hub-gl" aria-hidden="true">그래프</span><button type="button" class="hub-tab" role="tab" id="hub-tab-climate" aria-controls="hub-tool-climate" aria-selected="false" tabindex="-1" aria-label="기후 그래프 편집기">기후</button><button type="button" class="hub-tab" role="tab" id="hub-tab-energy" aria-controls="hub-tool-energy" aria-selected="false" tabindex="-1" aria-label="에너지 그래프 편집기">에너지</button><button type="button" class="hub-tab" role="tab" id="hub-tab-religion" aria-controls="hub-tool-religion" aria-selected="false" tabindex="-1" aria-label="종교 그래프 편집기">종교</button><button type="button" class="hub-tab" role="tab" id="hub-tab-population" aria-controls="hub-tool-population" aria-selected="false" tabindex="-1" aria-label="인구 그래프 편집기">인구</button><button type="button" class="hub-tab" role="tab" id="hub-tab-agriculture" aria-controls="hub-tool-agriculture" aria-selected="false" tabindex="-1" aria-label="농업 그래프 편집기">농업</button></div><div class="hub-group" role="presentation"><span class="hub-gl" aria-hidden="true">문항</span><button type="button" class="hub-tab" role="tab" id="hub-tab-item" aria-controls="hub-tool-item" aria-selected="false" tabindex="-1" aria-label="문항 설계">설계</button></div></nav>
    <div class="hub-actions"><label class="hub-btn" title="이 통합판에서 저장한 작업 파일을 알맞은 탭으로 열어요">작업 파일 열기<input type="file" id="hubOpen" accept=".json,application/json"></label></div>

<div class="tool t-mapquick" id="hub-tool-mapquick" role="tabpanel" aria-labelledby="hub-tab-mapquick" hidden></div>

  <div class="hub-toast" id="hubToast" role="status" aria-live="polite"></div>

<template id="hub-tpl-mapquick">
<div class="qapp">
  <header class="top">
    <div class="brand"><h1>백지도 자동 생성기</h1><small>문장 한 줄로 시험지 양식 백지도</small></div>
    <div class="top-actions"><a class="btn" id="editorLink" href="#open:mapedit">편집기에서 열기</a></div>
  </header>

  <section class="side">
    <form class="ask" id="askForm">
      <label class="ask-label" for="qk-q">어떤 지도가 필요하세요?</label>
      <textarea id="qk-q" rows="4" placeholder="예: 유럽 지도에 로테르담, 함부르크, 뮌헨, 마르세유를 A~D로 찍어 줘"></textarea>
      <div class="ask-row">
        <button class="btn primary" type="submit" id="go">지도 만들기</button>
        <button class="btn" type="button" id="stopBtn" hidden>멈추기</button>
        <button class="btn" type="button" id="claudeBtn" hidden title="문장 해석을 Claude에게 다시 맡겨요">Claude에게 다시 묻기</button>
        <span class="kbd-hint">Ctrl + Enter</span>
      </div>
      <p class="status" id="status" data-s="idle" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">지도 데이터를 불러오는 중이에요.</span></p>
    </form>

    <section class="result" aria-labelledby="mapquick-resTitle">
      <div class="result-head"><h2 class="sec-title" id="mapquick-resTitle">이렇게 이해했어요</h2><span class="via" id="via"></span><button class="btn small" id="newCtx" type="button" title="지금 지도를 잊고 다음 문장을 새 지도로 읽어요">새로 시작</button></div>
      <p class="answer" id="answer" hidden></p>
      <ul class="warn" id="warn" hidden></ul>
      <div class="items" id="items"><p class="empty" style="padding:10px">아직 만든 지도가 없어요.</p></div>
    </section>

    <section class="examples" aria-labelledby="mapquick-exTitle">
      <h2 class="sec-title" id="mapquick-exTitle">이렇게 써 보세요</h2>
      <div id="exList" style="display:flex;flex-direction:column;gap:6px"></div>
    </section>

    <details class="settings">
      <summary>글꼴 · 크기 · 해상도</summary>
      <div class="grid">
        <div class="row"><label for="qk-fontSel">라벨 글꼴</label><select id="qk-fontSel"></select></div>
        <div id="fontStatus"></div>
        <div class="row"><span class="lab"></span><label class="btn filebtn small">글꼴 파일 불러오기<input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2"></label></div>
        <div class="row"><label for="qk-fsz">라벨 글자</label><input type="range" id="qk-fsz" min="6" max="14" step="0.5" value="9"><span class="val" id="fszV">9 pt</span></div>
        <div class="row"><label for="qk-fw">틀 가로</label><input type="number" id="qk-fw" min="30" max="190" step="1"><span class="val">mm</span></div>
        <div class="row"><span class="lab">국경선</span><label class="check"><input type="checkbox" id="borders">점선으로 표시</label></div>
        <div class="row"><span class="lab">해상도</span><div class="seg" id="dpiSeg"><button type="button" data-v="300">300 dpi</button><button type="button" data-v="600" aria-pressed="true">600 dpi</button></div></div>
      </div>
    </details>

    <p class="mode-note" id="modeNote">Claude 연결을 확인하는 중이에요.</p>
  </section>

  <main class="desk" aria-label="만든 지도">
    <div class="desk-bar">
      <button class="btn primary" id="pngBtn" type="button">PNG 저장</button>
      <button class="btn" id="svgBtn" type="button">SVG 저장</button>
      <button class="btn" id="copyBtn" type="button">이미지 복사</button>
      <button class="btn" id="jsonBtn" type="button" title="편집기의 ‘작업 불러오기’로 열어 점·라벨을 손으로 고칠 수 있어요">편집기용 파일</button>
      <span class="info" id="sizeInfo"></span>
    </div>
    <div class="canvas-wrap" id="wrap"><canvas id="cv" aria-label="시험지 양식 백지도 미리 보기"></canvas><div class="loading" id="loading">지도 데이터를 불러오는 중…</div></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

</template>
<template id="hub-tpl-mapedit">
<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>세계지리 백지도 편집기</h1><small id="brandSub">시험지 양식 · 흰 육지 · 회색 바다 · 점선 국경</small><a class="brand-link" href="#open:mapquick" id="quickLink">문장으로 만들기 →</a></div>
    <div class="top-actions">
      <button class="btn icon" id="undoBtn" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5 3 9l4 4"/><path d="M3 9h9a5 5 0 0 1 0 10h-2"/></svg></button>
      <button class="btn icon" id="redoBtn" title="다시 하기 (Ctrl+Shift+Z)" aria-label="다시 하기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m13 5 4 4-4 4"/><path d="M17 9H8a5 5 0 0 0 0 10h2"/></svg></button>
      <button class="btn" id="newBtn">새 지도</button>
      <button class="btn" id="tidyBtn" title="겹친 라벨을 자동으로 다시 놓아요">라벨 정리</button>
      <span class="sep"></span>
      <button class="btn" id="copyBtn">이미지 복사</button>
      <button class="btn primary" id="pngBtn">PNG 저장</button>
    </div>
  </header>

  <nav class="rail" aria-label="도구">
    <button class="tool" data-tool="select" title="선택·이동 (V)" aria-label="선택·이동"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 3v13l3.6-3.4L11 18l2.3-1-2.4-5.3H16z"/></svg><kbd>V</kbd></button>
    <button class="tool" data-tool="dot" title="점 찍기 (D)" aria-label="점 찍기"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.2" fill="currentColor"/></svg><kbd>D</kbd></button>
    <button class="tool" data-tool="ring" title="빈 원 찍기 (O)" aria-label="빈 원 찍기"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.4" fill="none" stroke="currentColor" stroke-width="2"/></svg><kbd>O</kbd></button>
    <button class="tool" data-tool="text" title="글자 놓기 (T)" aria-label="글자 놓기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5h12M10 5v11"/></svg><kbd>T</kbd></button>
    <button class="tool" data-tool="shade" title="국가 음영 (S)" aria-label="국가 음영"><svg viewBox="0 0 20 20"><path d="M3 7l5-3 5 2 4-1v10l-5 2-5-2-4 1z" fill="currentColor" opacity=".45" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><kbd>S</kbd></button>
    <button class="tool" data-tool="leader" title="지시선 추가 (L)" aria-label="지시선 추가"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 15 15 5M4 15l12 1M4 15l6-11"/></svg><kbd>L</kbd></button>
    <button class="tool" data-tool="ellipse" title="점선 영역 (E)" aria-label="점선 영역"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="7" ry="4.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 1.6"/></svg><kbd>E</kbd></button>
    <hr>
    <button class="tool" id="zoomIn" title="확대" aria-label="확대"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 5v10M5 10h10"/></svg></button>
    <button class="tool" id="zoomOut" title="축소" aria-label="축소"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 10h10"/></svg></button>
    <button class="tool" id="fitItems" title="항목에 맞추기 (틀 크기는 그대로)" aria-label="항목에 맞추기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4"/><circle cx="8" cy="9" r="1.3" fill="currentColor"/><circle cx="12.5" cy="11.5" r="1.3" fill="currentColor"/></svg></button>
    <button class="tool" id="zoomFit" title="지역 범위로 되돌리기" aria-label="지역 범위로 되돌리기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4h4M16 8V4h-4M4 12v4h4M16 12v4h-4"/></svg></button>
  </nav>

  <main class="desk" id="desk">
    <canvas id="cv" aria-label="백지도 편집 화면"></canvas>
    <div class="hint" id="hint"><span id="hintText"></span></div>
    <div class="loading" id="loading">지도 데이터를 불러오는 중…</div>
    <div class="status"><span id="stPos">지도 위에 마우스를 올리면 좌표가 나와요</span><span id="stInfo"></span></div>
  </main>

  <aside class="panel">
    <div class="search">
      <input id="q" type="search" autocomplete="off" placeholder="지명·국가·좌표 검색 (예: 로테르담, 이란, 37.5 127)" aria-label="지명, 국가, 좌표 검색">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-map" aria-selected="true" data-tab="map">지도</button>
      <button role="tab" id="tab-style" aria-selected="false" data-tab="style">꾸미기</button>
      <button role="tab" id="tab-sel" aria-selected="false" data-tab="sel">항목<span class="dot" id="selDot" hidden></span></button>
      <button role="tab" id="tab-out" aria-selected="false" data-tab="out">내보내기</button>
    </div>

    <div class="pane" id="pane-map">
      <section class="grp"><h3>지역</h3><div class="chips" id="presets"></div></section>
      <section class="grp"><h3>도법 · 틀</h3>
        <div class="row"><label for="proj">도법</label><select id="proj" class="grow"></select></div>
        <div class="row"><label for="rot">중앙 경선</label><input id="rot" type="number" step="1"><span class="unit">° (동경 +, 서경 −)</span></div>
        <div class="row"><span class="lab">틀 크기</span><input id="fw" type="number" min="20" max="190" step="1" aria-label="틀 가로 mm"><span class="unit">×</span><input id="fh" type="number" min="15" max="270" step="1" aria-label="틀 세로 mm"><span class="unit">mm</span></div>
        <div class="row"><span class="lab">지도 데이터</span><div class="seg" id="detail"><button data-v="auto">자동</button><button data-v="xlo">간략</button><button data-v="lo">보통</button><button data-v="hi">자세히</button></div></div>
        <p class="note">틀 오른쪽 아래 모서리를 끌어도 크기가 바뀌어요. 시험지 지도는 보통 가로 45~70 mm예요. 해안선은 ‘자동’이면 넓은 지도일수록 단순하게 그려요.</p>
      </section>
      <section class="grp"><h3>표시 요소</h3>
        <div class="checks">
          <label class="check"><input type="checkbox" id="lyBorders">국경선(점선)</label>
          <label class="check"><input type="checkbox" id="lyLakes">호수</label>
          <label class="check" title="실제 해안선으로 그리고, 지도에서 너무 작으면 시험지 지도처럼 작은 점으로 찍어요(Natural Earth에는 독도가 없어서 SGIS 경계로 따로 그림)"><input type="checkbox" id="lyDokdo">울릉도·독도</label>
          <label class="check"><input type="checkbox" id="lnEq">적도</label>
          <label class="check"><input type="checkbox" id="lnTr">회귀선</label>
          <label class="check"><input type="checkbox" id="lnAc">극권</label>
          <label class="check"><input type="checkbox" id="lyMajor">주요 하천 전부</label>
        </div>
        <p class="sub-h">기후 지역(쾨펜)</p>
        <div id="zoneBelts" class="zone-belts"></div>
        <div id="zoneTones" class="zone-tones"></div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="plOn">판의 경계</label>
          <label class="check"><input type="checkbox" id="plTyped">수렴·발산·보존 구분</label>
          <label class="check"><input type="checkbox" id="plNames">판 이름</label>
        </div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="rlOn">습곡 산지·안정 육괴</label>
          <label class="check"><input type="checkbox" id="rlNames">산지 이름</label>
        </div>
        <div id="rlBox" hidden>
          <div id="rlCats"></div>
          <details class="rl-pick"><summary>산맥·순상지 고르기</summary><div id="rlList" class="checks"></div></details>
          <p class="note">교과서 분류에 따른 시험 지도 수준의 모식 경계예요(산맥: Natural Earth, 발트·아프리카·아라비아는 직접 그린 모식 경계).</p>
        </div>
        <div class="row" id="zoneLegRow" hidden><label for="zoneLeg">범례</label><select id="zoneLeg"><option value="bl">왼쪽 아래</option><option value="br">오른쪽 아래</option><option value="tl">왼쪽 위</option><option value="tr">오른쪽 위</option><option value="outR">지도 밖 오른쪽</option><option value="outB">지도 밖 아래</option><option value="none">없음</option></select></div>

      <div class="mapsend" id="itemSend" hidden style="border-top:0;margin-top:0;padding-top:0">
        <h2 class="sec-title" id="agriculture-isTitle">이 표로 문항 만들기</h2>
        <div class="paste-row"><a class="btn primary" id="itemSendBtn" href="#open:item">문항 설계로 보내기</a></div>
        <p class="sub">표의 나라·기호·수치를 문항 설계 3단계로 넘기고, 5단계에서 참·거짓이 판정된 선지 후보를 받아요. (문항 설계 탭에서 ‘표 가져오기’를 눌러도 같아요.)</p>
      </div>
    </section>
    <section class="sec" aria-labelledby="agriculture-msTitle">
      <div class="mapsend" id="mapSend" hidden style="border-top:0;margin-top:0;padding-top:0">
        <h2 class="sec-title" id="agriculture-msTitle">이 나라들을 백지도에</h2>
        <div class="paste-row">
          <select id="msRegion" aria-label="지도 범위"><option value="">범위 자동</option><option value="world-atl">세계 전도</option><option value="world-pac">태평양 중심</option></select>
          <select id="msLbl" aria-label="지도 기호"><option value="same">표의 기호를 붙임</option><option value="none">기호 없이 칠하기만</option></select>
          <select id="msTone" aria-label="칠하는 색"><option value="mid">중간 회색</option><option value="light">연한 회색</option><option value="dark">진한 회색</option></select>
        </div>
        <div class="paste-row"><a class="btn primary" id="mapSendBtn" href="#open:mapquick">지도 만들기</a></div>
        <p class="sub" id="msNote">세계지리 백지도 ‘자동 생성’ 탭에서 표의 나라를 칠한 지도를 만들어요.</p>
      </div>
    </section>
  </aside>

  <main class="desk" aria-label="그래프 미리 보기">
    <div class="desk-bar">
      <button class="btn primary" id="pngBtn" type="button">PNG 저장</button>
      <button class="btn" id="svgBtn" type="button">SVG 저장</button>
      <button class="btn" id="copyBtn" type="button">이미지 복사</button>
      <div class="seg" id="dpiSeg" role="group" aria-label="해상도"><button type="button" data-v="300">300 dpi</button><button type="button" data-v="600">600 dpi</button></div>
      <span class="info" id="sizeInfo"></span>
    </div>
    <p class="desk-warn" id="deskWarn" hidden></p>
    <div class="canvas-wrap"><canvas id="cv" aria-label="시험지 양식 농업 그래프"></canvas>
      <div class="desk-empty" id="deskEmpty"><div><b>그릴 자료가 없어요</b>왼쪽 ‘자료 불러오기’에서 작물과 지표를 골라 표를 만들거나, 문장으로 요청해 보세요.</div></div>
    </div>
  </main>

  <aside class="pane opts" aria-label="그래프 설정" id="opts"></aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
